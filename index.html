<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>Proportions</title>
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Proportions">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300&display=swap">

<style>
:root {
  /* Pop palette (chosen with the ?colori tuner) */
  --bg: #4D4DFF;            /* keypad area: electric blue */
  --bg-fields: #F2FBE3;     /* fields area: cream */
  --text-fields: #4D4DFF;
  --field-active: #FFFFFF;
  --equal: #4D4DFF;         /* fraction bars and = sign */
  --equal-off: #118D49;
  --equal-active: #22CC6E;
  --key: #FF2BD6;           /* magenta digits */
  --key-blue: #C629FF;      /* violet: C */
  --key-del: #FF6B35;       /* orange: DEL */
  --ink: #FFFFFF;
  --text-active: #4D4DFF;   /* number in the active field */
  --text-result: #FFFFFF;   /* result */
  --text-keys: #FFFFFF;     /* digits, +/- and comma keys */
  --text-c: #FFFFFF;
  --text-del: #FFFFFF;
  --text-equal: #FFFFFF;
}

/* GLOBAL */
* { box-sizing: border-box; margin:0; padding:0; }
html {
  background: var(--bg);
  overflow: hidden;
  height: 100%;
}
body {
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--ink);
  height: 100svh;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  overflow: hidden;
  overscroll-behavior: none;
  padding-bottom: env(safe-area-inset-bottom);
}

/* TOP GRID
   Layout as two fractions:  a     c
                             ─  =  ─
                             b     d   */
.top {
  flex: 1;
  background: var(--bg-fields);
  color: var(--text-fields);
  display: flex;
  justify-content: center;
  align-items: center;
}

.grid {
  /* Column width: 280px on desktop, shrinks to fit phones (16px side margins) */
  --col: min(280px, calc((100vw - 32px - 36px) / 2));
  position: relative;
  display: grid;
  grid-template-columns: var(--col) var(--col);
  column-gap: 36px;
  row-gap: 24px;
}

.field {
  height: 76px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 66px;
  font-weight: 300;
  line-height: 1;
  white-space: nowrap;
  cursor: pointer;
}

@media (max-width: 600px) {
  .field {
    height: 58px;
    font-size: 48px;
  }
}

.field.active {
  background: var(--field-active);
  color: var(--text-active);
  border-radius: 999px;
}

.field.inactive {
  opacity: 0.5;
}

/* FRACTION BARS */
.bar {
  position: absolute;
  top: 50%;
  width: var(--col);
  height: 2px;
  background: var(--equal);
  transform: translateY(-50%);
}

.bar.left  { left: 0; }
.bar.right { right: 0; }

.equal-top {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  font-size: 32px;
  color: var(--equal);
}

/* RESULT BOX (mobile: slides up in place of the keypad) */
.result {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: calc(4 * var(--k) + 3 * var(--gap) + 48px + env(safe-area-inset-bottom));
  background: var(--bg);
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 66px;
  font-weight: 300;
  transform: translateY(100%);
  transition: transform 0.18s ease-out;
  color: var(--text-result);
}

.result.show {
  transform: translateY(0);
}

/* KEYPAD: round keys. --k is the key size, --gap the space between keys.
   Proportions follow the iOS Calculator: gap = 10% of a key, digits ≈ 31% of
   a key tall. Four keys and three gaps = 4.3 keys across the screen. */
body {
  --k: min(100px, calc((100vw - 32px) / 4.3));
  --gap: calc(var(--k) * 0.1);
}

.keyboard {
  display: grid;
  grid-template-columns: repeat(4, var(--k));
  grid-template-rows: repeat(4, var(--k));
  gap: var(--gap);
  justify-content: center;
  padding-top: 24px;
  padding-bottom: 24px;
  transform: translateY(0);
  transition: transform 0.18s ease-out;
}

.keyboard.hide {
  transform: translateY(calc(100% + env(safe-area-inset-bottom)));
}

.key {
  background: var(--key);
  border-radius: 999px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: calc(var(--k) * 0.43);
  font-weight: 300;
  color: var(--text-keys);
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
}

.key[data-action="del"] {
  font-size: calc(var(--k) * 0.3);
}

.key.blue {
  background: var(--key-blue);
  color: var(--text-c);
}

.key.blue[data-action="del"] {
  background: var(--key-del);
  color: var(--text-del);
}

.key.equal {
  grid-column: 4;
  grid-row: 3 / span 2;
  font-size: calc(var(--k) * 0.56);
  background: var(--equal-off);
  color: var(--text-equal);
}

.key.equal.active {
  background: var(--equal-active);
}

.key:active {
  filter: brightness(0.95);
}

/* DESKTOP: fields on the left half; right half = result (2/6) + keypad (4/6) */
@media (min-width: 900px) {
  body {
    /* Key size: fits both the width and the height of the keypad area */
    --k: min(110px,
             calc((50vw - 96px) / 4.3),
             calc((66.67svh - 48px) / 4.3));
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 2fr 4fr;
    padding-bottom: 0;
  }

  .top {
    grid-column: 1;
    grid-row: 1 / span 2;
  }

  .grid {
    --col: min(280px, calc((50vw - 64px - 36px) / 2));
  }

  .result {
    position: static;
    grid-column: 2;
    grid-row: 1;
    /* Same width as the keypad, so the result lines up with keys 7, 4, 1 */
    width: calc(4 * var(--k) + 3 * var(--gap));
    justify-self: center;
    justify-content: flex-start;
    height: auto;
    transform: none;
    opacity: 0;
    transition: opacity 0.18s ease-out;
  }

  .result.show {
    opacity: 1;
  }

  .keyboard {
    grid-column: 2;
    grid-row: 2;
    align-content: start;
    padding-bottom: 48px;
  }

  .keyboard.hide {
    transform: none;
  }
}

/* COLOR TUNER (open with ?colori in the address) */
.tuner {
  position: fixed;
  top: 12px;
  right: 12px;
  z-index: 10;
  width: 260px;
  max-height: calc(100svh - 24px);
  overflow-y: auto;
  padding: 14px;
  background: rgba(255,255,255,0.96);
  color: #111;
  border-radius: 16px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.25);
  font-size: 13px;
  font-weight: 400;
}
.tuner.closed .tuner-body { display: none; }
.tuner-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: 500;
  cursor: pointer;
}
.tuner-row {
  display: grid;
  grid-template-columns: 32px 1fr 72px;
  align-items: center;
  gap: 8px;
  margin-top: 8px;
}
.tuner input[type=color] {
  width: 32px;
  height: 32px;
  border: 0;
  padding: 0;
  background: none;
  cursor: pointer;
}
.tuner input[type=text] {
  width: 72px;
  font: inherit;
  font-family: ui-monospace, Menlo, monospace;
  font-size: 12px;
  padding: 4px 6px;
  border: 1px solid #ccc;
  border-radius: 6px;
}
.tuner-actions {
  display: flex;
  gap: 8px;
  margin-top: 14px;
}
.tuner button {
  flex: 1;
  font: inherit;
  padding: 8px;
  border: 0;
  border-radius: 999px;
  background: #111;
  color: #fff;
  cursor: pointer;
}
.tuner button.secondary {
  background: #e6e6e6;
  color: #111;
}
</style>
</head>

<body>

<!-- TOP GRID: a/b = c/d  (f0 = a, f2 = b, f1 = c, f3 = d) -->
<div class="top">
  <div class="grid">
    <div class="field active" id="f0"></div>
    <div class="field" id="f1"></div>
    <div class="field" id="f2"></div>
    <div class="field" id="f3"></div>
    <div class="bar left"></div>
    <div class="bar right"></div>
    <div class="equal-top">=</div>
  </div>
</div>

<!-- RESULT -->
<div class="result" id="result"></div>

<!-- KEYBOARD -->
<div class="keyboard" id="keyboard">
  <div class="key">7</div>
  <div class="key">8</div>
  <div class="key">9</div>
  <div class="key blue" data-action="clear">C</div>

  <div class="key">4</div>
  <div class="key">5</div>
  <div class="key">6</div>
  <div class="key blue" data-action="del">DEL</div>

  <div class="key">1</div>
  <div class="key">2</div>
  <div class="key">3</div>
  <div class="key equal" data-action="equal">=</div>

  <div class="key" data-action="sign">+/-</div>
  <div class="key">0</div>
  <div class="key">,</div>
</div>

<script>
// PREVENT SCROLL & BOUNCE IN STANDALONE (PWA) MODE
if (window.navigator.standalone) {
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
}

// ELEMENTS
const fields = document.querySelectorAll('.field');
const equalKey = document.querySelector('.key.equal');
const keyboard = document.getElementById('keyboard');
const resultBox = document.getElementById('result');

let active = fields[0];

// SHRINK FONT SIZE WHEN A NUMBER IS TOO LONG FOR ITS FIELD
function fit(f){
  f.style.fontSize = "";
  let size = parseFloat(getComputedStyle(f).fontSize);
  while(f.scrollWidth > f.clientWidth && size > 12){
    size -= 2;
    f.style.fontSize = size + "px";
  }
}

fields.forEach(f=>{
  new MutationObserver(()=>fit(f)).observe(f, {childList:true, characterData:true, subtree:true});
});
window.addEventListener('resize', ()=>fields.forEach(fit));

// READ FIELD VALUE (accepts decimal comma)
function num(f){
  return parseFloat(f.innerText.replace(",", "."));
}

// ACTIVATE FIELD
fields.forEach(f=>{
  f.addEventListener('click', ()=>{
    hideResult();
    fields.forEach(x=>x.classList.remove('active'));
    f.classList.add('active');
    active = f;
  });
});

// KEYBOARD INPUT
document.querySelectorAll('.key').forEach(k=>{
  k.addEventListener('click', ()=> handleKey(k));
});

function handleKey(k){
  const val = k.innerText;
  const act = k.dataset.action;

  if(!act) active.innerText += val;
  if(act==="clear") active.innerText = "";
  if(act==="del") clearAll();
  if(act==="sign") {
    active.innerText = active.innerText.startsWith("-")
      ? active.innerText.slice(1)
      : "-" + active.innerText;
  }
  if(act==="equal") calculate();

  updateEqualState();
}

// UPDATE EQUAL BUTTON
function updateEqualState(){
  const filled = [...fields].map(num).filter(v=>!isNaN(v)).length;
  equalKey.classList.toggle("active", filled===3);
}

// CALCULATE PROPORTION  a/b = c/d  →  a·d = b·c
function calculate(){
  const v = [...fields].map(num);
  if(v.filter(x=>!isNaN(x)).length !==3) return;

  let result;
  let emptyIndex = v.findIndex(x=>isNaN(x));

  if(emptyIndex===0) result = (v[1]*v[2])/v[3];
  if(emptyIndex===1) result = (v[0]*v[3])/v[2];
  if(emptyIndex===2) result = (v[0]*v[3])/v[1];
  if(emptyIndex===3) result = (v[1]*v[2])/v[0];

  fields.forEach((f,i)=>{
    if(i===emptyIndex){
      f.innerText="x";
      f.classList.add("inactive");
    }
  });

  showResult(result.toLocaleString('it-IT', {maximumFractionDigits:2}));
}

// SHOW/HIDE RESULT
function showResult(val){
  resultBox.innerText = val;
  resultBox.classList.add("show");
  keyboard.classList.add("hide");
}

function hideResult(){
  resultBox.classList.remove("show");
  keyboard.classList.remove("hide");
  fields.forEach(f=>{
    if(f.innerText==="x"){
      f.innerText="";
      f.classList.remove("inactive");
    }
  });
}

// CLEAR ALL FIELDS
function clearAll(){
  resultBox.classList.remove("show");
  keyboard.classList.remove("hide");
  fields.forEach(f=>{
    f.innerText="";
    f.classList.remove("inactive");
  });
  updateEqualState();
}

// DESKTOP KEYBOARD INPUT
document.addEventListener('keydown', e=>{
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  if(e.target.closest && e.target.closest('.tuner')) return;

  // Digits
  if(/^[0-9]$/.test(e.key)){
    if(resultBox.classList.contains("show")) hideResult();
    active.innerText += e.key;
    updateEqualState();
    e.preventDefault(); return;
  }
  // Decimal separator
  if(e.key==="." || e.key===","){
    if(resultBox.classList.contains("show")) hideResult();
    active.innerText += ",";
    updateEqualState();
    e.preventDefault(); return;
  }
  // Backspace → delete last character
  if(e.key==="Backspace"){
    active.innerText = active.innerText.slice(0,-1);
    updateEqualState();
    e.preventDefault(); return;
  }
  // Delete → clear current field (like C)
  if(e.key==="Delete"){
    active.innerText = "";
    updateEqualState();
    e.preventDefault(); return;
  }
  // Escape → clear all fields (like DEL)
  if(e.key==="Escape"){
    clearAll();
    e.preventDefault(); return;
  }
  // Enter / = → calculate
  if(e.key==="Enter" || e.key==="="){
    calculate();
    e.preventDefault(); return;
  }
  // Minus → toggle sign
  if(e.key==="-"){
    active.innerText = active.innerText.startsWith("-")
      ? active.innerText.slice(1)
      : "-"+active.innerText;
    updateEqualState();
    e.preventDefault(); return;
  }
  // Tab → next field in reading order a → b → c → d (f0 → f2 → f1 → f3)
  if(e.key==="Tab"){
    const order = [0,2,1,3];
    const pos = order.indexOf([...fields].indexOf(active));
    const next = order[(pos + (e.shiftKey ? 3 : 1)) % 4];
    hideResult();
    fields.forEach(f=>f.classList.remove("active"));
    fields[next].classList.add("active");
    active = fields[next];
    e.preventDefault(); return;
  }
  // Arrow keys → navigate 2×2 grid
  // Layout: f0 f1 / f2 f3
  const arrowNav = {
    ArrowRight: [1,1,3,3],
    ArrowLeft:  [0,0,2,2],
    ArrowDown:  [2,3,2,3],
    ArrowUp:    [0,1,0,1]
  };
  if(arrowNav[e.key]!==undefined){
    const idx = [...fields].indexOf(active);
    const next = arrowNav[e.key][idx];
    hideResult();
    fields.forEach(f=>f.classList.remove("active"));
    fields[next].classList.add("active");
    active = fields[next];
    e.preventDefault();
  }
});

// COLOR TUNER — open the app with ?colori in the address to try colors live
(function(){
  const params = new URLSearchParams(location.search);
  if(!params.has('colori')) return;

  const vars = [
    ['--bg-fields',    'Sfondo campi'],
    ['--text-fields',  'Numeri nei campi'],
    ['--field-active', 'Campo attivo'],
    ['--equal',        'Barre e segno ='],
    ['--bg',           'Sfondo tastiera'],
    ['--text-active',  'Numero nel campo attivo'],
    ['--text-result',  'Risultato'],
    ['--key',          'Tasti numeri'],
    ['--text-keys',    'Cifre sui tasti'],
    ['--key-blue',     'Tasto C'],
    ['--text-c',       'Testo tasto C'],
    ['--key-del',      'Tasto DEL'],
    ['--text-del',     'Testo tasto DEL'],
    ['--equal-off',    'Tasto = spento'],
    ['--equal-active', 'Tasto = acceso'],
    ['--text-equal',   'Testo tasto =']
  ];
  const root = document.documentElement;
  const initial = {};
  vars.forEach(([v])=> initial[v] = getComputedStyle(root).getPropertyValue(v).trim().toUpperCase());

  // Colors passed in the address (e.g. ?colori&bg-fields=4D4DFF) override the defaults
  vars.forEach(([v])=>{
    const p = params.get(v.slice(2));
    if(p && /^[0-9a-f]{6}$/i.test(p)) root.style.setProperty(v, '#'+p.toUpperCase());
  });

  const panel = document.createElement('div');
  panel.className = 'tuner';
  panel.innerHTML = '<div class="tuner-head"><span>Colori</span><span class="tuner-toggle">–</span></div><div class="tuner-body"></div>';
  const body = panel.querySelector('.tuner-body');

  function current(v){ return getComputedStyle(root).getPropertyValue(v).trim().toUpperCase(); }

  function syncAddress(){
    const q = new URLSearchParams();
    q.set('colori','');
    vars.forEach(([v])=>{ if(current(v)!==initial[v]) q.set(v.slice(2), current(v).slice(1)); });
    history.replaceState(null, '', '?' + q.toString().replace('colori=','colori'));
  }

  vars.forEach(([v,label])=>{
    const row = document.createElement('label');
    row.className = 'tuner-row';
    row.innerHTML = '<input type="color"><span></span><input type="text" maxlength="7">';
    const [picker, name, hex] = [row.children[0], row.children[1], row.children[2]];
    name.textContent = label;
    const set = val=>{
      root.style.setProperty(v, val);
      picker.value = val.toLowerCase();
      hex.value = val;
      syncAddress();
    };
    picker.value = current(v).toLowerCase();
    hex.value = current(v);
    picker.addEventListener('input', ()=> set(picker.value.toUpperCase()));
    hex.addEventListener('change', ()=>{
      let val = hex.value.trim().replace(/^#?/, '#').toUpperCase();
      if(/^#[0-9A-F]{6}$/.test(val)) set(val); else hex.value = current(v);
    });
    body.appendChild(row);
  });

  const actions = document.createElement('div');
  actions.className = 'tuner-actions';
  actions.innerHTML = '<button type="button">Copia colori</button><button type="button" class="secondary">Reset</button>';
  const [copyBtn, resetBtn] = actions.children;
  copyBtn.addEventListener('click', ()=>{
    const text = vars.map(([v,label])=> label + ': ' + current(v)).join('\n') + '\n\n' + location.href;
    navigator.clipboard.writeText(text).then(()=>{
      copyBtn.textContent = 'Copiati!';
      setTimeout(()=> copyBtn.textContent = 'Copia colori', 1500);
    });
  });
  resetBtn.addEventListener('click', ()=>{
    vars.forEach(([v])=> root.style.removeProperty(v));
    body.querySelectorAll('.tuner-row').forEach((row,i)=>{
      const val = current(vars[i][0]);
      row.children[0].value = val.toLowerCase();
      row.children[2].value = val;
    });
    syncAddress();
  });
  body.appendChild(actions);

  panel.querySelector('.tuner-head').addEventListener('click', ()=>{
    panel.classList.toggle('closed');
    panel.querySelector('.tuner-toggle').textContent = panel.classList.contains('closed') ? '+' : '–';
  });
  // Start collapsed on phones so the app stays usable
  if(window.innerWidth < 600){
    panel.classList.add('closed');
    panel.querySelector('.tuner-toggle').textContent = '+';
  }
  document.body.appendChild(panel);
})();
</script>

</body>
</html>
