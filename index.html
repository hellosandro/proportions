<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>POPortions</title>
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="POPortions">
<meta name="theme-color" content="#F2FBE3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300&display=swap">

<style>
:root {
  /* Pop palette (chosen with the ?colori tuner) */
  --bg: #4D4DFF;            /* keypad area: electric blue */
  --bg-fields: #4D4DFF;     /* fields area: same blue as the keypad */
  --field-idle: #7F81F7;    /* pills of fields not being written */
  --text-idle: #FFFFFF;     /* numbers in fields not being written */
  --icon-bg: #7F81F7;       /* round badge behind the settings icon */
  --text-fields: #4D4DFF;
  --field-active: #FFFFFF;
  --equal: #F2FBE3;         /* fraction bars and = sign */
  --icon: #F2FBE3;          /* settings button */
  --equal-off: #22CC6E;     /* = key always looks active */
  --equal-active: #22CC6E;
  --key: #FF2BD6;           /* magenta digits */
  --key-blue: #C629FF;      /* violet: C */
  --key-del: #FF6B35;       /* orange: DEL */
  --ink: #FFFFFF;
  --text-active: #4D4DFF;   /* number in the active field */
  --text-result: #FFFFFF;   /* result */
  --text-keys: #FFFFFF;     /* digits, +/- and comma keys */
  --text-c: #FFFFFF;
  --text-del: #FFFFFF;
  --text-equal: #FFFFFF;
}

/* GLOBAL */
* { box-sizing: border-box; margin:0; padding:0; }
html {
  -webkit-tap-highlight-color: transparent;
  background: var(--bg);
  overflow: hidden;
  height: 100%;
}
body {
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--ink);
  height: 100svh;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  overflow: hidden;
  overscroll-behavior: none;
  padding-bottom: env(safe-area-inset-bottom);
}

/* TOP GRID
   Layout as two fractions:  a     c
                             ─  =  ─
                             b     d   */
.top {
  position: relative;
  flex: 1;
  background: var(--bg-fields);
  color: var(--text-fields);
  display: flex;
  justify-content: center;
  align-items: center;
}

/* Phones and tablets: fields sit right above the keypad, with the same
   24px gap the keypad keeps from the top of its own area. Each field is as
   wide as two keys plus the gap between them, so fields and keypad share
   the same width, columns and left edge. */
@media (max-width: 899px) {
  .top {
    justify-content: flex-start;
    padding-left: round(down, calc((100vw - 4 * var(--k) - 3 * var(--gap)) / 2), 1px);
    align-items: flex-end;
    padding-bottom: 24px;
    /* keep the settings badge clear of the first field */
    padding-top: calc(16px + var(--k) / 2 + 12px + env(safe-area-inset-top));
  }
}

.grid {
  /* Column width: 280px on desktop, shrinks to fit phones (16px side margins) */
  --col: min(280px, calc((100vw - 32px - 36px) / 2));
  position: relative;
  display: grid;
  grid-template-columns: var(--col) var(--col);
  column-gap: 36px;
  row-gap: 24px;
}

@media (max-width: 899px) {
  .grid {
    --col: calc(2 * var(--k) + var(--gap));
    column-gap: var(--gap);
  }
  .top .settings-btn {
    left: round(down, calc((100vw - 4 * var(--k) - 3 * var(--gap)) / 2), 1px);
  }
}

.field {
  height: var(--k);   /* same as the key diameter */
  padding: 0 calc(var(--k) * 0.25);   /* keep long numbers off the rounded ends */
  background: var(--field-idle);
  border-radius: 999px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 66px;
  font-weight: 300;
  line-height: 1;
  white-space: nowrap;
  cursor: pointer;
}

@media (max-width: 600px) {
  .field {
    font-size: 48px;
  }
}

.field:not(.active) {
  background: var(--field-idle);
  color: var(--text-idle, var(--text-fields));
}

/* Live result: the unknown field takes the colors of the = key */
.field.computed {
  background: var(--equal-active);
  color: var(--text-equal);
}
body.rows .field.computed {
  background: var(--row-eq);
  color: var(--row-text);
}

/* The unknown "x", waiting for = */
.field.unknown {
  color: color-mix(in srgb, var(--text-idle, var(--text-fields)) 50%, transparent);
}

/* Blinking caret in the active field, so it is clear where you are typing */
.field.active::after {
  content: "";
  width: 2px;
  height: 0.75em;
  margin-left: 0.06em;
  background: currentColor;
  border-radius: 1px;
  animation: caret 1.1s steps(1) infinite;
}
@keyframes caret {
  0%, 50% { opacity: 1; }
  50.01%, 100% { opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .field.active::after { animation: none; }
}

.field.active {
  box-shadow: inset 0 0 0 1.5px var(--field-active-border, transparent);
  background: var(--field-active);
  color: var(--text-active);
  border-radius: 999px;
}

/* FRACTION BARS */
.bar {
  position: absolute;
  top: 50%;
  width: calc(var(--col) / 2);   /* half the field width, centered under it */
  height: 2px;
  background: var(--equal);
  transform: translateY(-50%);
}

.bar.left  { left: calc(var(--col) / 4); }
.bar.right { right: calc(var(--col) / 4); }

.equal-top {
  position: absolute;
  left: 50%;
  top: 50%;
  /* the "=" glyph sits low in its line box: lift it to the bars' axis */
  transform: translate(-50%, calc(-50% - 0.07em));
  font-size: calc(var(--k) * 0.56);   /* same size as the = on the key */
  line-height: 1;
  color: var(--equal);
}

/* RESULT BOX (mobile: slides up in place of the keypad) */
.result {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: calc(4 * var(--k) + 3 * var(--gap) + 48px + env(safe-area-inset-bottom));
  background: var(--bg);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 0 16px;
  white-space: nowrap;
  font-size: 66px;
  font-weight: 300;
  transform: translateY(100%);
  transition: transform 0.18s ease-out;
  color: var(--text-result);
}

.result.show {
  transform: translateY(0);
}

/* KEYPAD: round keys. --k is the key size, --gap the space between keys.
   Proportions follow the iOS Calculator: gap = 10% of a key, digits ≈ 31% of
   a key tall. Four keys and three gaps = 4.3 keys across the screen. */
body {
  /* Whole pixels: fractional sizes make Safari draw the round edges slightly off */
  /* The key size must fit the width (4 keys + 3 gaps = 4.3 keys) and the
     height: badge row (28px + k/2) + two fields (2k + 24px) + 24px + keypad
     (4.3k + 48px) = 6.8k + 124px, plus the safe areas. With Safari's bars
     showing, height is often the tighter limit on iPhone. */
  --k: round(down, min(100px,
                       calc((100vw - 32px) / 4.3),
                       calc((100svh - 124px - env(safe-area-inset-top) - env(safe-area-inset-bottom)) / 6.8)), 1px);
  --gap: round(calc(var(--k) * 0.1), 1px);
}

.keyboard {
  display: grid;
  grid-template-columns: repeat(4, var(--k));
  grid-template-rows: repeat(4, var(--k));
  gap: var(--gap);
  /* Centered by hand, rounded to a whole pixel (plain centering can land on .5px) */
  --keys-left: round(down, calc((100vw - 4 * var(--k) - 3 * var(--gap)) / 2), 1px);
  justify-content: start;
  padding-left: var(--keys-left);
  padding-top: 24px;
  padding-bottom: 24px;
  transform: translateY(0);
  transition: transform 0.18s ease-out;
}

.keyboard.hide {
  transform: translateY(calc(100% + env(safe-area-inset-bottom)));
}

.key {
  background: var(--key);
  border-radius: 999px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: calc(var(--k) * 0.43);
  font-weight: 300;
  color: var(--text-keys);
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}

.key[data-action="del"] {
  font-size: calc(var(--k) * 0.3);
}

.key.blue {
  background: var(--key-blue);
  color: var(--text-c);
}

.key.blue[data-action="del"] {
  background: var(--key-del);
  color: var(--text-del);
}

.key.equal {
  grid-column: 4;
  grid-row: 3 / span 2;
  font-size: calc(var(--k) * 0.56);
  /* The "=" glyph sits low in its line box: lift it to the optical center */
  padding-bottom: 0.15em;
  background: var(--equal-active);   /* = is always shown as active */
  color: var(--text-equal);
}

.key.equal.active {
  background: var(--equal-active);
}

.key:active {
  filter: brightness(0.95);
}

/* ROW THEMES: each keypad row has its own color (e.g. Arcobaleno) */
body.rows .key[data-row="1"] { background: var(--row1); }
body.rows .key[data-row="2"] { background: var(--row2); }
body.rows .key[data-row="3"] { background: var(--row3); }
body.rows .key[data-row="4"] { background: var(--row4); }
body.rows .key.equal,
body.rows .key.equal.active { background: var(--row-eq); }
body.rows .key,
body.rows .key.blue[data-action="del"] { color: var(--row-text); }

/* DESKTOP: fields on the left half; right half = result (2/6) + keypad (4/6) */
@media (min-width: 900px) {
  body {
    /* Key size: fits both the width and the height of the keypad area */
    --k: round(down, min(110px,
             calc((50vw - 96px) / 4.3),
             calc((66.67svh - 48px) / 4.3)), 1px);
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 2fr 4fr;
    padding-bottom: 0;
  }

  .top {
    grid-column: 1;
    grid-row: 1 / span 2;
  }

  .grid {
    --col: min(280px, calc((50vw - 64px - 36px) / 2));
  }

  /* The result replaces the keypad, centered in the right half */
  .result {
    position: static;
    grid-column: 2;
    grid-row: 1 / span 2;
    width: auto;
    height: auto;
    transform: none;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s ease-out;
  }

  .result.show {
    opacity: 1;
  }

  .keyboard {
    --keys-left: round(down, calc((50vw - 4 * var(--k) - 3 * var(--gap)) / 2), 1px);
    grid-column: 2;
    grid-row: 2;
    align-content: start;
    padding-bottom: 48px;
  }

  .keyboard.hide {
    transform: none;
    opacity: 0;
    pointer-events: none;
  }
  .keyboard { transition: opacity 0.18s ease-out; }
}

/* SETTINGS: button in the top-left corner of the fields area, panel as a sheet */
.settings-btn {
  position: absolute;
  top: calc(16px + env(safe-area-inset-top));
  left: 16px;
  width: calc(var(--k) / 2);
  height: calc(var(--k) / 2);
  display: flex;
  justify-content: center;
  align-items: center;
  border: 0;
  border-radius: 999px;
  background: var(--icon-bg);
  color: var(--icon, var(--text-fields));
  cursor: pointer;
}
.settings-btn svg { width: 55%; height: 55%; }
.settings-btn:active { opacity: 0.6; }
.settings-btn:focus { outline: none; }
.settings-btn:focus-visible { outline: 1.5px solid currentColor; }

.settings {
  position: fixed;
  inset: 0;
  padding-top: env(safe-area-inset-top);
  z-index: 20;
  display: flex;
  justify-content: center;
  align-items: flex-end;
  background: rgba(0,0,0,0.35);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.18s ease-out;
}
.settings.open {
  opacity: 1;
  pointer-events: auto;
}
.settings-card {
  width: 100%;
    max-width: 420px;
  /* never reach under the notch / status bar */
  max-height: calc(100svh - env(safe-area-inset-top) - 24px);
  overflow-y: auto;
  padding: 24px 24px calc(24px + env(safe-area-inset-bottom));
  background: #FFFFFF;
  color: #111111;
  border-radius: 28px 28px 0 0;
  transform: translateY(24px);
  transition: transform 0.18s ease-out;
}
.settings.open .settings-card { transform: translateY(0); }
@media (min-width: 600px) {
  .settings { align-items: center; }
  .settings-card { border-radius: 28px; }
}
.settings-head {
  /* title and close button stay visible while the themes scroll */
  position: sticky;
  top: -24px;
  z-index: 1;
  margin-top: -24px;
  padding-top: 24px;
  padding-bottom: 12px;
  background: #FFFFFF;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}
.settings h2 {
  font-size: 28px;
  font-weight: 300;
}
.settings h3 {
  font-size: 13px;
  font-weight: 300;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  opacity: 0.55;
  margin: 24px 0 12px;
}
.settings-close {
  width: 40px;
  height: 40px;
  border: 0;
  border-radius: 999px;
  background: #F0F0F0;
  color: #111;
  font: inherit;
  font-size: 22px;
  font-weight: 300;
  cursor: pointer;
}
.themes {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}
.theme {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 12px;
  border: 2px solid transparent;
  border-radius: 20px;
  background: #F4F4F4;
  color: #111;
  font: inherit;
  font-size: 15px;
  font-weight: 300;
  text-align: left;
  cursor: pointer;
}
.theme.selected { border-color: #111; }
.theme-swatch {
  display: flex;
  height: 44px;
  border-radius: 12px;
  overflow: hidden;
}
.theme-swatch span { flex: 1; }
.edit-colors {
  width: 100%;
  margin-top: 12px;
  padding: 14px;
  border: 0;
  border-radius: 999px;
  background: #111;
  color: #fff;
  font: inherit;
  font-size: 15px;
  font-weight: 300;
  cursor: pointer;
}
.modes {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.mode {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 14px 16px;
  border: 2px solid transparent;
  border-radius: 20px;
  background: #F4F4F4;
  color: #111;
  font: inherit;
  font-size: 17px;
  font-weight: 300;
  text-align: left;
  cursor: pointer;
}
.mode span { font-size: 13px; opacity: 0.55; }
.mode.selected { border-color: #111; }
.credits {
  font-size: 15px;
  font-weight: 300;
  line-height: 1.6;
}
.credits a { color: inherit; }

/* COLOR TUNER: compact bar at the top (open with "Edit colors" or ?colori) */
.tuner {
  --tuner-gap: 8px;
  position: fixed;
  z-index: 10;
  top: calc(8px + env(safe-area-inset-top));
  left: 8px;
  right: 8px;
  max-width: 560px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: var(--tuner-gap);
  padding: 10px;
  background: rgba(255,255,255,0.97);
  color: #111;
  border-radius: 20px;
  box-shadow: 0 6px 24px rgba(0,0,0,0.22);
  font-size: 15px;
  font-weight: 300;
}
.tuner-line {
  min-width: 0;
  display: flex;
  align-items: center;
  gap: var(--tuner-gap);
}
.tuner select {
  flex: 1;
  min-width: 0;
  height: 40px;
  padding: 0 12px;
  border: 0;
  border-radius: 999px;
  background: #F0F0F0;
  color: #111;
  font: inherit;
  font-size: 16px;   /* 16px avoids iOS zooming into the menu */
}
.tuner input[type=color] {
  flex: none;
  width: 40px;
  height: 40px;
  border: 0;
  padding: 0;
  background: none;
  cursor: pointer;
}
.tuner input[type=text] {
  flex: 1;
  min-width: 0;
  height: 40px;
  padding: 0 10px;
  border: 1px solid #D6D6D6;
  border-radius: 999px;
  font-family: ui-monospace, Menlo, monospace;
  font-size: 16px;
}
.tuner button {
  flex: none;
  height: 40px;
  min-width: 40px;
  padding: 0 14px;
  border: 0;
  border-radius: 999px;
  background: #111;
  color: #fff;
  font: inherit;
  font-size: 15px;
  cursor: pointer;
}
.tuner button.secondary { background: #E6E6E6; color: #111; }
.tuner-parts { display: flex; gap: 4px; flex: none; }
.tuner-parts button { padding: 0 12px; }
.tuner-parts button.on { background: #111; color: #fff; }
.tuner .tuner-close { padding: 0; font-size: 22px; }

/* While the bar is open, phones give it room: the fields area starts lower and
   the keys shrink to fit the remaining height */
body.tuning { --tuner-h: 108px; }
body.tuning .settings-btn { visibility: hidden; }
@media (max-width: 899px) {
  /* the bar takes the badge's place: bar + 16px + two fields (2k + 24px) +
     24px + keypad (4.3k + 48px) = 6.3k + 112px + bar */
  body.tuning {
    --k: round(down, min(100px,
                         calc((100vw - 32px) / 4.3),
                         calc((100svh - 112px - var(--tuner-h) - env(safe-area-inset-top) - env(safe-area-inset-bottom)) / 6.3)), 1px);
  }
  body.tuning .top {
    padding-top: calc(var(--tuner-h) + 16px + env(safe-area-inset-top));
  }
}
</style>
</head>

<body>

<!-- TOP GRID: a/b = c/d  (f0 = a, f2 = b, f1 = c, f3 = d) -->
<div class="top">
  <button class="settings-btn" id="settingsBtn" type="button" aria-label="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <line x1="3" y1="7" x2="21" y2="7"/><circle cx="15" cy="7" r="2.5" fill="var(--icon-bg)"/>
      <line x1="3" y1="17" x2="21" y2="17"/><circle cx="9" cy="17" r="2.5" fill="var(--icon-bg)"/>
    </svg>
  </button>
  <div class="grid">
    <div class="field active" id="f0"></div>
    <div class="field" id="f1"></div>
    <div class="field" id="f2"></div>
    <div class="field" id="f3"></div>
    <div class="bar left"></div>
    <div class="bar right"></div>
    <div class="equal-top">=</div>
  </div>
</div>

<!-- RESULT -->
<div class="result" id="result"></div>

<!-- KEYBOARD -->
<div class="keyboard" id="keyboard">
  <div class="key">7</div>
  <div class="key">8</div>
  <div class="key">9</div>
  <div class="key blue" data-action="clear">C</div>

  <div class="key">4</div>
  <div class="key">5</div>
  <div class="key">6</div>
  <div class="key blue" data-action="del">DEL</div>

  <div class="key">1</div>
  <div class="key">2</div>
  <div class="key">3</div>
  <div class="key equal" data-action="equal">=</div>

  <div class="key" data-action="sign">+/-</div>
  <div class="key">0</div>
  <div class="key">,</div>
</div>

<!-- SETTINGS -->
<div class="settings" id="settings" aria-hidden="true">
  <div class="settings-card" role="dialog" aria-label="Settings">
    <div class="settings-head">
      <h2>Settings</h2>
      <button class="settings-close" id="settingsClose" type="button" aria-label="Close">×</button>
    </div>
    <h3>Colors</h3>
    <div class="themes" id="themes"></div>
    <button class="edit-colors" id="editColors" type="button">Edit colors</button>
    <h3>Result</h3>
    <div class="modes">
      <button class="mode" type="button" data-mode="live">Live<span>as you type</span></button>
      <button class="mode" type="button" data-mode="equal">With =<span>when you press =</span></button>
    </div>
    <h3>Credits</h3>
    <p class="credits">
      POPortions<br>
      Design by <a href="https://www.sandrostefanelli.it" target="_blank" rel="noopener">Sandro Stefanelli</a><br>
      Typeface Inter by Rasmus Andersson
    </p>
  </div>
</div>

<script>
// PREVENT SCROLL & BOUNCE IN STANDALONE (PWA) MODE
if (window.navigator.standalone) {
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
}

// ELEMENTS
const fields = document.querySelectorAll('.field');
const keyboard = document.getElementById('keyboard');
const resultBox = document.getElementById('result');

let active = fields[0];

// SHRINK FONT SIZE WHEN A NUMBER IS TOO LONG FOR ITS FIELD
function fit(f){
  f.style.fontSize = "";
  const cs = getComputedStyle(f);
  const room = f.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const range = document.createRange();
  range.selectNodeContents(f);
  let size = parseFloat(cs.fontSize);
  // the caret adds about 0.1em after the number in the active field
  while(range.getBoundingClientRect().width + size * 0.1 > room && size > 12){
    size -= 2;
    f.style.fontSize = size + "px";
  }
}

fields.forEach(f=>{
  new MutationObserver(()=>fit(f)).observe(f, {childList:true, characterData:true, subtree:true});
});
window.addEventListener('resize', ()=>fields.forEach(fit));

// READ FIELD VALUE (accepts decimal comma). A computed result is not a value you typed.
function num(f){
  if(f.classList.contains('computed') || f.classList.contains('unknown')) return NaN;
  // a result taken over as a value keeps its full precision until you edit it
  if(f.dataset.exact && f.innerText === f.dataset.shown) return parseFloat(f.dataset.exact);
  return parseFloat(f.innerText.replace(",", "."));
}

// UNKNOWN FIELD — the field shown as "x". It is chosen the first time three
// fields are filled (the one left empty). Pressing = shows the result in the
// keypad's place. After that, tapping any field makes its partner in the same
// fraction column (above or below) the unknown one: the result is kept as a
// value of the field it belonged to, so you can edit it.
let liveIndex = null;
let solved = false;          // = was pressed (until the next edit)
let lastResult = NaN;        // latest result, at full precision

// RESULT MODE — "live": the unknown field shows the result while you type and =
// shows it big in the keypad's place. "equal": the field shows x until = .
let liveMode = true;
try { liveMode = localStorage.getItem('proportions-mode') !== 'equal'; } catch(e) {}
let replaceOnType = false;   // first keystroke replaces a value taken over from a result
const partner = i => [2, 3, 0, 1][i];   // f0 a ↔ f2 b, f1 c ↔ f3 d

function formatNumber(n){
  return n.toLocaleString('it-IT', {maximumFractionDigits:2, useGrouping:false});
}

// SHOW / HIDE THE RESULT (it takes the keypad's place)
function showResult(text){
  resultBox.innerText = text;
  resultBox.classList.add('show');
  keyboard.classList.add('hide');
  fitResult();
}
function hideResult(){
  resultBox.classList.remove('show');
  keyboard.classList.remove('hide');
}
function fitResult(){
  resultBox.style.fontSize = '';
  const cs = getComputedStyle(resultBox);
  const room = resultBox.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const range = document.createRange();
  range.selectNodeContents(resultBox);
  let size = parseFloat(cs.fontSize);
  while(range.getBoundingClientRect().width > room && size > 12){
    size -= 2;
    resultBox.style.fontSize = size + 'px';
  }
}

// tapping the result brings the keypad back
resultBox.addEventListener('click', hideResult);

// ACTIVATE FIELD
function activate(f){
  const i = [...fields].indexOf(f);
  replaceOnType = false;
  hideResult();

  const hasResult = liveIndex !== null && isFinite(lastResult) && (solved || liveMode);
  if(hasResult && partner(i) !== liveIndex){
    // keep the result as the value of its field, and make the partner the unknown
    const r = fields[liveIndex];
    r.classList.remove('unknown', 'computed');
    r.innerText = formatNumber(lastResult);
    r.dataset.exact = lastResult;
    r.dataset.shown = r.innerText;
    if(i === liveIndex) replaceOnType = true;  // typing in it starts a new number
    liveIndex = partner(i);
    fields[liveIndex].innerText = '';
  } else if(i === liveIndex){
    liveIndex = null;                          // no result yet: just a normal field
  }
  solved = false;

  fields.forEach(x=>x.classList.remove('active'));
  f.classList.add('active');
  active = f;
  updateLive();
}

// Typing helpers: after taking over a result, the first key starts a new number
function typeChar(ch){
  solved = false;
  hideResult();
  if(replaceOnType){ active.innerText = ''; replaceOnType = false; }
  active.innerText += ch;
}
function editActive(fn){
  solved = false;
  hideResult();
  replaceOnType = false;
  active.innerText = fn(active.innerText);
}

fields.forEach(f=> f.addEventListener('click', ()=> activate(f)));

// KEYBOARD INPUT
document.querySelectorAll('.key').forEach(k=>{
  k.addEventListener('click', ()=> handleKey(k));
});

function handleKey(k){
  const val = k.innerText;
  const act = k.dataset.action;

  if(!act) typeChar(val);
  if(act==="clear") editActive(()=> "");
  if(act==="del") clearAll();
  if(act==="sign") toggleSign();
  if(act==="equal"){ calculate(); return; }

  updateLive();
}

function toggleSign(){
  editActive(t=> t.startsWith("-") ? t.slice(1) : "-" + t);
}

// PROPORTION  a/b = c/d  →  a·d = b·c
function solve(v, i){
  if(i===0) return (v[1]*v[2])/v[3];
  if(i===1) return (v[0]*v[3])/v[2];
  if(i===2) return (v[0]*v[3])/v[1];
  return (v[1]*v[2])/v[0];
}

// Shows "x" (or, in live mode, the result) in the unknown field
function updateLive(){
  const v = [...fields].map(num);
  if(liveIndex === null){
    const empty = v.findIndex(x=>isNaN(x));
    if(v.filter(x=>!isNaN(x)).length === 3 && fields[empty] !== active) liveIndex = empty;
  }
  const i = liveIndex;
  const ready = i !== null && v.every((x,j)=> j===i || !isNaN(x));
  lastResult = ready ? solve(v, i) : NaN;

  fields.forEach((f,j)=>{
    const wasX = f.classList.contains('unknown') || f.classList.contains('computed');
    f.classList.remove('computed', 'unknown');
    if(j===i && ready && liveMode && isFinite(lastResult)){
      f.classList.add('computed');
      f.innerText = formatNumber(lastResult);
    } else if(j===i && ready){
      f.classList.add('unknown');
      f.innerText = 'x';
    } else if(wasX){
      f.innerText = '';
    }
  });
}

// = : calculate and show the result in place of the keypad
function calculate(){
  // with three numbers in, the unknown is the fourth field, even if you are in it
  const v = [...fields].map(num);
  if(v.filter(x=>!isNaN(x)).length === 3) liveIndex = v.findIndex(x=>isNaN(x));
  updateLive();
  if(!isFinite(lastResult)) return;
  solved = true;
  showResult(formatNumber(lastResult));
}

function setMode(live){
  liveMode = live;
  try { localStorage.setItem('proportions-mode', live ? 'live' : 'equal'); } catch(e) {}
  document.querySelectorAll('.mode').forEach(b=> b.classList.toggle('selected', (b.dataset.mode==='live')===live));
  updateLive();
}

// CLEAR ALL FIELDS
function clearAll(){
  liveIndex = null;
  solved = false;
  hideResult();
  replaceOnType = false;
  fields.forEach(f=>{
    f.innerText="";
    f.classList.remove("computed", "unknown");
  });
  updateLive();
}

// DESKTOP KEYBOARD INPUT
document.addEventListener('keydown', e=>{
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  if(e.target.closest && e.target.closest('.tuner')) return;
  if(document.getElementById('settings').classList.contains('open')){
    if(e.key==="Escape") closeSettings();
    return;
  }

  // Digits
  if(/^[0-9]$/.test(e.key)){
    typeChar(e.key);
    updateLive();
    e.preventDefault(); return;
  }
  // Decimal separator
  if(e.key==="." || e.key===","){
    typeChar(",");
    updateLive();
    e.preventDefault(); return;
  }
  // Backspace → delete last character
  if(e.key==="Backspace"){
    editActive(t=> t.slice(0,-1));
    updateLive();
    e.preventDefault(); return;
  }
  // Delete → clear current field (like C)
  if(e.key==="Delete"){
    editActive(()=> "");
    updateLive();
    e.preventDefault(); return;
  }
  // Escape → clear all fields (like DEL)
  if(e.key==="Escape"){
    clearAll();
    e.preventDefault(); return;
  }
  // Enter / = → calculate
  if(e.key==="Enter" || e.key==="="){
    calculate();
    e.preventDefault(); return;
  }
  // Minus → toggle sign
  if(e.key==="-"){
    toggleSign();
    updateLive();
    e.preventDefault(); return;
  }
  // Tab → next field in reading order a → b → c → d (f0 → f2 → f1 → f3)
  if(e.key==="Tab"){
    const order = [0,2,1,3];
    const pos = order.indexOf([...fields].indexOf(active));
    activate(fields[order[(pos + (e.shiftKey ? 3 : 1)) % 4]]);
    e.preventDefault(); return;
  }
  // Arrow keys → navigate 2×2 grid
  // Layout: f0 f1 / f2 f3
  const arrowNav = {
    ArrowRight: [1,1,3,3],
    ArrowLeft:  [0,0,2,2],
    ArrowDown:  [2,3,2,3],
    ArrowUp:    [0,1,0,1]
  };
  if(arrowNav[e.key]!==undefined){
    activate(fields[arrowNav[e.key][[...fields].indexOf(active)]]);
    e.preventDefault();
  }
});

// KEYPAD ROWS: 7 8 9 C / 4 5 6 DEL / 1 2 3 = / +/- 0 ,  (the = key spans rows 3-4)
document.querySelectorAll('.key').forEach((k,i)=>{ k.dataset.row = Math.floor(i/4) + 1; });

let currentTheme = 'pop';
function applyTheme(id){
  const theme = THEMES[id] || THEMES.pop;
  currentTheme = THEMES[id] ? id : 'pop';
  Object.entries(theme.colors).forEach(([v,c])=> document.documentElement.style.setProperty(v, c));
  document.body.classList.toggle('rows', !!theme.rows);
  document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme.colors['--bg-fields']);
  document.querySelectorAll('.theme').forEach(b=> b.classList.toggle('selected', b.dataset.theme===id));
  if(window.refreshTuner) window.refreshTuner();
}

let savedTheme = 'pop';
try { savedTheme = localStorage.getItem('proportions-theme') || 'pop'; } catch(e) {}
if(!THEMES[savedTheme]) savedTheme = 'pop';

const themesBox = document.getElementById('themes');
Object.entries(THEMES).forEach(([id,t])=>{
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'theme';
  b.dataset.theme = id;
  const c = t.colors;
  const swatch = t.rows
    ? [c['--bg-fields'], c['--row1'], c['--row2'], c['--row3'], c['--row-eq'], c['--row4']]
    : null;
  b.innerHTML = '<span class="theme-swatch">' +
    (swatch || [c['--bg-fields'], c['--field-active'], c['--key'], c['--key-blue'], c['--key-del'], c['--equal-active']])
      .map(x=>'<span style="background:'+x+'"></span>').join('') +
    '</span>' + t.name;
  b.addEventListener('click', ()=>{
    applyTheme(id);
    try { localStorage.setItem('proportions-theme', id); } catch(e) {}
  });
  themesBox.appendChild(b);
});
applyTheme(savedTheme);

// COLOR TUNER — opened from "Edit colors" in the settings, or with ?colori in the address.
// A compact bar at the top. Tap any part of the app to select it (or use the
// menu), pick what to color (fill, text, border) and set the color.
// On phones the app shrinks a little to make room, so nothing is covered.
function tunerGroups(){
  const rows = document.body.classList.contains('rows');
  const g = [
    {id:'fields-bg', label:'Fields background',       parts:[['Fill','--bg-fields']]},
    {id:'bars',      label:'Bars and = sign',    parts:[['Color','--equal']]},
    {id:'active',    label:'Active field',       parts:[['Fill','--field-active'],['Number','--text-active'],['Border','--field-active-border']]},
    {id:'idle',      label:'Other fields',   parts:[['Fill','--field-idle'],['Number','--text-idle']]},
    {id:'badge',     label:'Settings button', parts:[['Fill','--icon-bg'],['Icon','--icon']]},
    {id:'kbd-bg',    label:'Keypad background',    parts:[['Fill','--bg']]},
    {id:'result',    label:'Big result',   parts:[['Text','--text-result']]}
  ];
  if(rows){
    g.push(
      {id:'row1', label:'Row 7 8 9 C',   parts:[['Fill','--row1'],['Text','--row-text']]},
      {id:'row2', label:'Row 4 5 6 DEL', parts:[['Fill','--row2'],['Text','--row-text']]},
      {id:'row3', label:'Row 1 2 3',     parts:[['Fill','--row3'],['Text','--row-text']]},
      {id:'row4', label:'Row +/- 0 ,',   parts:[['Fill','--row4'],['Text','--row-text']]},
      {id:'eq',   label:'= key',        parts:[['Fill','--row-eq'],['Text','--row-text']]}
    );
  } else {
    g.push(
      {id:'keys', label:'Number keys', parts:[['Fill','--key'],['Digits','--text-keys']]},
      {id:'c',    label:'C key',      parts:[['Fill','--key-blue'],['Text','--text-c']]},
      {id:'del',  label:'DEL key',    parts:[['Fill','--key-del'],['Text','--text-del']]},
      {id:'eq',   label:'= key', parts:[['Fill','--equal-active'],['Text','--text-equal']]}
    );
  }
  return g;
}

// Which group a tap on the app belongs to
function tunerTarget(el){
  const rows = document.body.classList.contains('rows');
  const key = el.closest('.key');
  if(key){
    if(key.classList.contains('equal')) return 'eq';
    if(rows) return 'row' + key.dataset.row;
    if(key.dataset.action === 'clear') return 'c';
    if(key.dataset.action === 'del') return 'del';
    return 'keys';
  }
  const field = el.closest('.field');
  if(field){
    if(field.classList.contains('computed')) return 'eq';
    return field.classList.contains('active') ? 'active' : 'idle';
  }
  if(el.closest('.bar, .equal-top')) return 'bars';
  if(el.closest('.settings-btn')) return 'badge';
  if(el.closest('#result')) return 'result';
  if(el.closest('.top')) return 'fields-bg';
  return 'kbd-bg';
}

function openTuner(){
  if(document.querySelector('.tuner')) return;
  const params = new URLSearchParams(location.search);
  const groups = tunerGroups();
  const allVars = [...new Set(groups.flatMap(g=> g.parts.map(p=> p[1])))];
  const labelOf = v => { for(const g of groups) for(const [n,x] of g.parts) if(x===v) return g.label + (g.parts.length>1 ? ' – ' + n.toLowerCase() : ''); return v; };

  const root = document.documentElement;
  const current = v => getComputedStyle(root).getPropertyValue(v).trim().toUpperCase();
  const themeValue = v => ((THEMES[currentTheme] || THEMES.pop).colors[v] || '').toUpperCase();

  // Colors passed in the address (e.g. ?colori&bg-fields=4D4DFF) override the theme
  allVars.forEach(v=>{
    const p = params.get(v.slice(2));
    if(p && /^[0-9a-f]{6}$/i.test(p)) root.style.setProperty(v, '#'+p.toUpperCase());
  });

  const panel = document.createElement('div');
  panel.className = 'tuner';
  panel.innerHTML =
    '<div class="tuner-line">' +
      '<select class="tuner-select" aria-label="Element"></select>' +
      '<div class="tuner-parts"></div>' +
    '</div>' +
    '<div class="tuner-line">' +
      '<input type="color" class="tuner-picker">' +
      '<input type="text" class="tuner-hex" maxlength="7" spellcheck="false">' +
      '<button type="button" class="tuner-copy">Copy</button>' +
      '<button type="button" class="secondary tuner-reset">Reset</button>' +
      '<button type="button" class="secondary tuner-close" aria-label="Close">×</button>' +
    '</div>';
  const select = panel.querySelector('.tuner-select');
  const partsBox = panel.querySelector('.tuner-parts');
  const picker = panel.querySelector('.tuner-picker');
  const hex = panel.querySelector('.tuner-hex');
  groups.forEach(g=>{
    const o = document.createElement('option');
    o.value = g.id; o.textContent = g.label;
    select.appendChild(o);
  });

  let group = groups[0];
  let variable = group.parts[0][1];

  function syncAddress(){
    const q = new URLSearchParams();
    q.set('colori','');
    allVars.forEach(v=>{ if(current(v)!==themeValue(v)) q.set(v.slice(2), current(v).slice(1)); });
    history.replaceState(null, '', '?' + q.toString().replace('colori=','colori'));
  }
  function show(){
    const val = current(variable);
    picker.value = val.toLowerCase();
    hex.value = val;
    partsBox.querySelectorAll('button').forEach(b=> b.classList.toggle('on', b.dataset.v===variable));
  }
  function choose(id, keepPart){
    const g = groups.find(x=> x.id===id) || groups[0];
    const sameKind = keepPart && g.parts.find(p=> p[0]===keepPart);
    group = g;
    variable = (sameKind || g.parts[0])[1];
    select.value = g.id;
    partsBox.innerHTML = '';
    if(g.parts.length > 1) g.parts.forEach(([name,v])=>{
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'secondary';
      b.dataset.v = v;
      b.textContent = name;
      b.addEventListener('click', ()=>{ variable = v; show(); });
      partsBox.appendChild(b);
    });
    show();
  }
  function set(val){
    root.style.setProperty(variable, val);
    show();
    syncAddress();
  }

  select.addEventListener('change', ()=> choose(select.value));
  picker.addEventListener('input', ()=> set(picker.value.toUpperCase()));
  hex.addEventListener('change', ()=>{
    const val = hex.value.trim().replace(/^#?/, '#').toUpperCase();
    if(/^#[0-9A-F]{6}$/.test(val)) set(val); else show();
  });

  // Tap anything in the app to select it (instead of typing or calculating)
  const pick = e=>{
    if(e.target.closest('.tuner, .settings')) return;
    e.preventDefault();
    e.stopPropagation();
    const currentPart = (group.parts.find(p=> p[1]===variable) || [''])[0];
    choose(tunerTarget(e.target), currentPart);
  };
  document.addEventListener('click', pick, true);

  const copyBtn = panel.querySelector('.tuner-copy');
  copyBtn.addEventListener('click', ()=>{
    const text = allVars.map(v=> labelOf(v) + ': ' + current(v)).join('\n') + '\n\n' + location.href;
    navigator.clipboard.writeText(text).then(()=>{
      copyBtn.textContent = 'Copied!';
      setTimeout(()=> copyBtn.textContent = 'Copy', 1500);
    });
  });
  panel.querySelector('.tuner-reset').addEventListener('click', ()=> applyTheme(currentTheme));
  panel.querySelector('.tuner-close').addEventListener('click', ()=>{
    document.removeEventListener('click', pick, true);
    panel.remove();
    window.refreshTuner = null;
    document.body.classList.remove('tuning');
    history.replaceState(null, '', location.pathname);
    fields.forEach(fit);
  });

  // Keep the bar in sync when a theme is picked in the settings
  window.refreshTuner = ()=>{ show(); syncAddress(); };
  choose(groups[0].id);
  syncAddress();

  document.body.appendChild(panel);
  document.body.classList.add('tuning');
  fields.forEach(fit);
}

document.querySelectorAll('.mode').forEach(b=> b.addEventListener('click', ()=> setMode(b.dataset.mode==='live')));
setMode(liveMode);

document.getElementById('editColors').addEventListener('click', ()=>{
  closeSettings();
  openTuner();
});
if(new URLSearchParams(location.search).has('colori')) openTuner();
</script>

</body>
</html>
