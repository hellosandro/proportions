<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>POPortions</title>
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="POPortions">
<meta name="theme-color" content="#F2FBE3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300&display=swap">

<style>
:root {
  /* Pop palette (chosen with the ?colori tuner) */
  --bg: #4D4DFF;            /* keypad area: electric blue */
  --bg-fields: #4D4DFF;     /* fields area: same blue as the keypad */
  --field-idle: #7F81F7;    /* pills of fields not being written */
  --text-idle: #FFFFFF;     /* numbers in fields not being written */
  --icon-bg: #7F81F7;       /* round badge behind the settings icon */
  --text-fields: #4D4DFF;
  --field-active: #FFFFFF;
  --equal: #F2FBE3;         /* fraction bars and = sign */
  --icon: #F2FBE3;          /* settings button */
  --equal-off: #22CC6E;     /* = key always looks active */
  --equal-active: #22CC6E;
  --key: #FF2BD6;           /* magenta digits */
  --key-blue: #C629FF;      /* violet: C */
  --key-del: #FF6B35;       /* orange: DEL */
  --ink: #FFFFFF;
  --text-active: #4D4DFF;   /* number in the active field */
  --text-result: #FFFFFF;   /* result */
  --text-keys: #FFFFFF;     /* digits, +/- and comma keys */
  --text-c: #FFFFFF;
  --text-del: #FFFFFF;
  --text-equal: #FFFFFF;
}

/* GLOBAL */
* { box-sizing: border-box; margin:0; padding:0; }
html {
  -webkit-tap-highlight-color: transparent;
  background: var(--bg);
  overflow: hidden;
  height: 100%;
}
body {
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--ink);
  height: 100svh;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  overflow: hidden;
  overscroll-behavior: none;
  padding-bottom: env(safe-area-inset-bottom);
}

/* TOP GRID
   Layout as two fractions:  a     c
                             ─  =  ─
                             b     d   */
.top {
  position: relative;
  flex: 1;
  background: var(--bg-fields);
  color: var(--text-fields);
  display: flex;
  justify-content: center;
  align-items: center;
}

.grid {
  /* Column width: 280px on desktop, shrinks to fit phones (16px side margins) */
  --col: min(280px, calc((100vw - 32px - 36px) / 2));
  position: relative;
  display: grid;
  grid-template-columns: var(--col) var(--col);
  column-gap: 36px;
  row-gap: 24px;
}

.field {
  height: var(--k);   /* same as the key diameter */
  background: var(--field-idle);
  border-radius: 999px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 66px;
  font-weight: 300;
  line-height: 1;
  white-space: nowrap;
  cursor: pointer;
}

@media (max-width: 600px) {
  .field {
    font-size: 48px;
  }
}

.field:not(.active) {
  background: var(--field-idle);
  color: var(--text-idle, var(--text-fields));
}

.field.active {
  background: var(--field-active);
  color: var(--text-active);
  border-radius: 999px;
}

.field.inactive {
  /* Fade only the "x", not the pill behind it */
  color: color-mix(in srgb, var(--text-idle, var(--text-fields)) 50%, transparent);
}

/* FRACTION BARS */
.bar {
  position: absolute;
  top: 50%;
  width: var(--col);
  height: 2px;
  background: var(--equal);
  transform: translateY(-50%);
}

.bar.left  { left: 0; }
.bar.right { right: 0; }

.equal-top {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  font-size: 32px;
  color: var(--equal);
}

/* RESULT BOX (mobile: slides up in place of the keypad) */
.result {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: calc(4 * var(--k) + 3 * var(--gap) + 48px + env(safe-area-inset-bottom));
  background: var(--bg);
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 66px;
  font-weight: 300;
  transform: translateY(100%);
  transition: transform 0.18s ease-out;
  color: var(--text-result);
}

.result.show {
  transform: translateY(0);
}

/* KEYPAD: round keys. --k is the key size, --gap the space between keys.
   Proportions follow the iOS Calculator: gap = 10% of a key, digits ≈ 31% of
   a key tall. Four keys and three gaps = 4.3 keys across the screen. */
body {
  /* Whole pixels: fractional sizes make Safari draw the round edges slightly off */
  --k: round(down, min(100px, calc((100vw - 32px) / 4.3)), 1px);
  --gap: round(calc(var(--k) * 0.1), 1px);
}

.keyboard {
  display: grid;
  grid-template-columns: repeat(4, var(--k));
  grid-template-rows: repeat(4, var(--k));
  gap: var(--gap);
  /* Centered by hand, rounded to a whole pixel (plain centering can land on .5px) */
  --keys-left: round(down, calc((100vw - 4 * var(--k) - 3 * var(--gap)) / 2), 1px);
  justify-content: start;
  padding-left: var(--keys-left);
  padding-top: 24px;
  padding-bottom: 24px;
  transform: translateY(0);
  transition: transform 0.18s ease-out;
}

.keyboard.hide {
  transform: translateY(calc(100% + env(safe-area-inset-bottom)));
}

.key {
  background: var(--key);
  border-radius: 999px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: calc(var(--k) * 0.43);
  font-weight: 300;
  color: var(--text-keys);
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}

.key[data-action="del"] {
  font-size: calc(var(--k) * 0.3);
}

.key.blue {
  background: var(--key-blue);
  color: var(--text-c);
}

.key.blue[data-action="del"] {
  background: var(--key-del);
  color: var(--text-del);
}

.key.equal {
  grid-column: 4;
  grid-row: 3 / span 2;
  font-size: calc(var(--k) * 0.56);
  /* The "=" glyph sits low in its line box: lift it to the optical center */
  padding-bottom: 0.15em;
  background: var(--equal-off);
  color: var(--text-equal);
}

.key.equal.active {
  background: var(--equal-active);
}

.key:active {
  filter: brightness(0.95);
}

/* ROW THEMES: each keypad row has its own color (e.g. Arcobaleno) */
body.rows .key[data-row="1"] { background: var(--row1); }
body.rows .key[data-row="2"] { background: var(--row2); }
body.rows .key[data-row="3"] { background: var(--row3); }
body.rows .key[data-row="4"] { background: var(--row4); }
body.rows .key.equal,
body.rows .key.equal.active { background: var(--row-eq); }
body.rows .key { color: var(--row-text); }

/* DESKTOP: fields on the left half; right half = result (2/6) + keypad (4/6) */
@media (min-width: 900px) {
  body {
    /* Key size: fits both the width and the height of the keypad area */
    --k: round(down, min(110px,
             calc((50vw - 96px) / 4.3),
             calc((66.67svh - 48px) / 4.3)), 1px);
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 2fr 4fr;
    padding-bottom: 0;
  }

  .top {
    grid-column: 1;
    grid-row: 1 / span 2;
  }

  .grid {
    --col: min(280px, calc((50vw - 64px - 36px) / 2));
  }

  .result {
    position: static;
    grid-column: 2;
    grid-row: 1;
    /* Same width as the keypad, so the result lines up with keys 7, 4, 1 */
    width: calc(4 * var(--k) + 3 * var(--gap));
    justify-self: start;
    margin-left: round(down, calc((50vw - 4 * var(--k) - 3 * var(--gap)) / 2), 1px);
    justify-content: flex-start;
    height: auto;
    transform: none;
    opacity: 0;
    transition: opacity 0.18s ease-out;
  }

  .result.show {
    opacity: 1;
  }

  .keyboard {
    --keys-left: round(down, calc((50vw - 4 * var(--k) - 3 * var(--gap)) / 2), 1px);
    grid-column: 2;
    grid-row: 2;
    align-content: start;
    padding-bottom: 48px;
  }

  .keyboard.hide {
    transform: none;
  }
}

/* SETTINGS: button in the top-left corner of the fields area, panel as a sheet */
.settings-btn {
  position: absolute;
  top: calc(16px + env(safe-area-inset-top));
  left: 16px;
  width: calc(var(--k) / 2);
  height: calc(var(--k) / 2);
  display: flex;
  justify-content: center;
  align-items: center;
  border: 0;
  border-radius: 999px;
  background: var(--icon-bg);
  color: var(--icon, var(--text-fields));
  cursor: pointer;
}
.settings-btn svg { width: 55%; height: 55%; }
.settings-btn:active { opacity: 0.6; }
.settings-btn:focus { outline: none; }
.settings-btn:focus-visible { outline: 1.5px solid currentColor; }

.settings {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  justify-content: center;
  align-items: flex-end;
  background: rgba(0,0,0,0.35);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.18s ease-out;
}
.settings.open {
  opacity: 1;
  pointer-events: auto;
}
.settings-card {
  width: 100%;
    max-width: 420px;
  max-height: 90svh;
  overflow-y: auto;
  padding: 24px 24px calc(24px + env(safe-area-inset-bottom));
  background: #FFFFFF;
  color: #111111;
  border-radius: 28px 28px 0 0;
  transform: translateY(24px);
  transition: transform 0.18s ease-out;
}
.settings.open .settings-card { transform: translateY(0); }
@media (min-width: 600px) {
  .settings { align-items: center; }
  .settings-card { border-radius: 28px; }
}
.settings-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
}
.settings h2 {
  font-size: 28px;
  font-weight: 300;
}
.settings h3 {
  font-size: 13px;
  font-weight: 300;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  opacity: 0.55;
  margin: 24px 0 12px;
}
.settings-close {
  width: 40px;
  height: 40px;
  border: 0;
  border-radius: 999px;
  background: #F0F0F0;
  color: #111;
  font: inherit;
  font-size: 22px;
  font-weight: 300;
  cursor: pointer;
}
.themes {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}
.theme {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 12px;
  border: 2px solid transparent;
  border-radius: 20px;
  background: #F4F4F4;
  color: #111;
  font: inherit;
  font-size: 15px;
  font-weight: 300;
  text-align: left;
  cursor: pointer;
}
.theme.selected { border-color: #111; }
.theme-swatch {
  display: flex;
  height: 44px;
  border-radius: 12px;
  overflow: hidden;
}
.theme-swatch span { flex: 1; }
.edit-colors {
  width: 100%;
  margin-top: 12px;
  padding: 14px;
  border: 0;
  border-radius: 999px;
  background: #111;
  color: #fff;
  font: inherit;
  font-size: 15px;
  font-weight: 300;
  cursor: pointer;
}
.credits {
  font-size: 15px;
  font-weight: 300;
  line-height: 1.6;
}
.credits a { color: inherit; }

/* COLOR TUNER (open with ?colori in the address) */
.tuner {
  position: fixed;
  top: 12px;
  right: 12px;
  z-index: 10;
  width: 260px;
  max-height: calc(100svh - 24px);
  overflow-y: auto;
  padding: 14px;
  background: rgba(255,255,255,0.96);
  color: #111;
  border-radius: 16px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.25);
  font-size: 13px;
  font-weight: 400;
}
.tuner.closed .tuner-body { display: none; }
.tuner-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: 500;
  cursor: pointer;
}
.tuner-row {
  display: grid;
  grid-template-columns: 32px 1fr 72px;
  align-items: center;
  gap: 8px;
  margin-top: 8px;
}
.tuner input[type=color] {
  width: 32px;
  height: 32px;
  border: 0;
  padding: 0;
  background: none;
  cursor: pointer;
}
.tuner input[type=text] {
  width: 72px;
  font: inherit;
  font-family: ui-monospace, Menlo, monospace;
  font-size: 12px;
  padding: 4px 6px;
  border: 1px solid #ccc;
  border-radius: 6px;
}
.tuner-actions {
  display: flex;
  gap: 8px;
  margin-top: 14px;
}
.tuner button {
  flex: 1;
  font: inherit;
  padding: 8px;
  border: 0;
  border-radius: 999px;
  background: #111;
  color: #fff;
  cursor: pointer;
}
.tuner button.secondary {
  background: #e6e6e6;
  color: #111;
}
</style>
</head>

<body>

<!-- TOP GRID: a/b = c/d  (f0 = a, f2 = b, f1 = c, f3 = d) -->
<div class="top">
  <button class="settings-btn" id="settingsBtn" type="button" aria-label="Impostazioni">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <line x1="3" y1="7" x2="21" y2="7"/><circle cx="15" cy="7" r="2.5" fill="var(--icon-bg)"/>
      <line x1="3" y1="17" x2="21" y2="17"/><circle cx="9" cy="17" r="2.5" fill="var(--icon-bg)"/>
    </svg>
  </button>
  <div class="grid">
    <div class="field active" id="f0"></div>
    <div class="field" id="f1"></div>
    <div class="field" id="f2"></div>
    <div class="field" id="f3"></div>
    <div class="bar left"></div>
    <div class="bar right"></div>
    <div class="equal-top">=</div>
  </div>
</div>

<!-- RESULT -->
<div class="result" id="result"></div>

<!-- KEYBOARD -->
<div class="keyboard" id="keyboard">
  <div class="key">7</div>
  <div class="key">8</div>
  <div class="key">9</div>
  <div class="key blue" data-action="clear">C</div>

  <div class="key">4</div>
  <div class="key">5</div>
  <div class="key">6</div>
  <div class="key blue" data-action="del">DEL</div>

  <div class="key">1</div>
  <div class="key">2</div>
  <div class="key">3</div>
  <div class="key equal" data-action="equal">=</div>

  <div class="key" data-action="sign">+/-</div>
  <div class="key">0</div>
  <div class="key">,</div>
</div>

<!-- SETTINGS -->
<div class="settings" id="settings" aria-hidden="true">
  <div class="settings-card" role="dialog" aria-label="Impostazioni">
    <div class="settings-head">
      <h2>Impostazioni</h2>
      <button class="settings-close" id="settingsClose" type="button" aria-label="Chiudi">×</button>
    </div>
    <h3>Colori</h3>
    <div class="themes" id="themes"></div>
    <button class="edit-colors" id="editColors" type="button">Modifica colori</button>
    <h3>Crediti</h3>
    <p class="credits">
      POPortions<br>
      Design di <a href="https://www.sandrostefanelli.it" target="_blank" rel="noopener">Sandro Stefanelli</a><br>
      Carattere Inter di Rasmus Andersson
    </p>
  </div>
</div>

<script>
// PREVENT SCROLL & BOUNCE IN STANDALONE (PWA) MODE
if (window.navigator.standalone) {
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
}

// ELEMENTS
const fields = document.querySelectorAll('.field');
const equalKey = document.querySelector('.key.equal');
const keyboard = document.getElementById('keyboard');
const resultBox = document.getElementById('result');

let active = fields[0];

// SHRINK FONT SIZE WHEN A NUMBER IS TOO LONG FOR ITS FIELD
function fit(f){
  f.style.fontSize = "";
  let size = parseFloat(getComputedStyle(f).fontSize);
  while(f.scrollWidth > f.clientWidth && size > 12){
    size -= 2;
    f.style.fontSize = size + "px";
  }
}

fields.forEach(f=>{
  new MutationObserver(()=>fit(f)).observe(f, {childList:true, characterData:true, subtree:true});
});
window.addEventListener('resize', ()=>fields.forEach(fit));

// READ FIELD VALUE (accepts decimal comma)
function num(f){
  return parseFloat(f.innerText.replace(",", "."));
}

// ACTIVATE FIELD
fields.forEach(f=>{
  f.addEventListener('click', ()=>{
    hideResult();
    fields.forEach(x=>x.classList.remove('active'));
    f.classList.add('active');
    active = f;
  });
});

// KEYBOARD INPUT
document.querySelectorAll('.key').forEach(k=>{
  k.addEventListener('click', ()=> handleKey(k));
});

function handleKey(k){
  const val = k.innerText;
  const act = k.dataset.action;

  if(!act) active.innerText += val;
  if(act==="clear") active.innerText = "";
  if(act==="del") clearAll();
  if(act==="sign") {
    active.innerText = active.innerText.startsWith("-")
      ? active.innerText.slice(1)
      : "-" + active.innerText;
  }
  if(act==="equal") calculate();

  updateEqualState();
}

// UPDATE EQUAL BUTTON
function updateEqualState(){
  const filled = [...fields].map(num).filter(v=>!isNaN(v)).length;
  equalKey.classList.toggle("active", filled===3);
}

// CALCULATE PROPORTION  a/b = c/d  →  a·d = b·c
function calculate(){
  const v = [...fields].map(num);
  if(v.filter(x=>!isNaN(x)).length !==3) return;

  let result;
  let emptyIndex = v.findIndex(x=>isNaN(x));

  if(emptyIndex===0) result = (v[1]*v[2])/v[3];
  if(emptyIndex===1) result = (v[0]*v[3])/v[2];
  if(emptyIndex===2) result = (v[0]*v[3])/v[1];
  if(emptyIndex===3) result = (v[1]*v[2])/v[0];

  fields.forEach((f,i)=>{
    if(i===emptyIndex){
      f.innerText="x";
      f.classList.add("inactive");
    }
  });

  showResult(result.toLocaleString('it-IT', {maximumFractionDigits:2}));
}

// SHOW/HIDE RESULT
function showResult(val){
  resultBox.innerText = val;
  resultBox.classList.add("show");
  keyboard.classList.add("hide");
}

function hideResult(){
  resultBox.classList.remove("show");
  keyboard.classList.remove("hide");
  fields.forEach(f=>{
    if(f.innerText==="x"){
      f.innerText="";
      f.classList.remove("inactive");
    }
  });
}

// CLEAR ALL FIELDS
function clearAll(){
  resultBox.classList.remove("show");
  keyboard.classList.remove("hide");
  fields.forEach(f=>{
    f.innerText="";
    f.classList.remove("inactive");
  });
  updateEqualState();
}

// DESKTOP KEYBOARD INPUT
document.addEventListener('keydown', e=>{
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  if(e.target.closest && e.target.closest('.tuner')) return;
  if(document.getElementById('settings').classList.contains('open')){
    if(e.key==="Escape") closeSettings();
    return;
  }

  // Digits
  if(/^[0-9]$/.test(e.key)){
    if(resultBox.classList.contains("show")) hideResult();
    active.innerText += e.key;
    updateEqualState();
    e.preventDefault(); return;
  }
  // Decimal separator
  if(e.key==="." || e.key===","){
    if(resultBox.classList.contains("show")) hideResult();
    active.innerText += ",";
    updateEqualState();
    e.preventDefault(); return;
  }
  // Backspace → delete last character
  if(e.key==="Backspace"){
    active.innerText = active.innerText.slice(0,-1);
    updateEqualState();
    e.preventDefault(); return;
  }
  // Delete → clear current field (like C)
  if(e.key==="Delete"){
    active.innerText = "";
    updateEqualState();
    e.preventDefault(); return;
  }
  // Escape → clear all fields (like DEL)
  if(e.key==="Escape"){
    clearAll();
    e.preventDefault(); return;
  }
  // Enter / = → calculate
  if(e.key==="Enter" || e.key==="="){
    calculate();
    e.preventDefault(); return;
  }
  // Minus → toggle sign
  if(e.key==="-"){
    active.innerText = active.innerText.startsWith("-")
      ? active.innerText.slice(1)
      : "-"+active.innerText;
    updateEqualState();
    e.preventDefault(); return;
  }
  // Tab → next field in reading order a → b → c → d (f0 → f2 → f1 → f3)
  if(e.key==="Tab"){
    const order = [0,2,1,3];
    const pos = order.indexOf([...fields].indexOf(active));
    const next = order[(pos + (e.shiftKey ? 3 : 1)) % 4];
    hideResult();
    fields.forEach(f=>f.classList.remove("active"));
    fields[next].classList.add("active");
    active = fields[next];
    e.preventDefault(); return;
  }
  // Arrow keys → navigate 2×2 grid
  // Layout: f0 f1 / f2 f3
  const arrowNav = {
    ArrowRight: [1,1,3,3],
    ArrowLeft:  [0,0,2,2],
    ArrowDown:  [2,3,2,3],
    ArrowUp:    [0,1,0,1]
  };
  if(arrowNav[e.key]!==undefined){
    const idx = [...fields].indexOf(active);
    const next = arrowNav[e.key][idx];
    hideResult();
    fields.forEach(f=>f.classList.remove("active"));
    fields[next].classList.add("active");
    active = fields[next];
    e.preventDefault();
  }
});

// KEYPAD ROWS: 7 8 9 C / 4 5 6 DEL / 1 2 3 = / +/- 0 ,  (the = key spans rows 3-4)

let currentTheme = 'pop';
function applyTheme(id){
  const theme = THEMES[id] || THEMES.pop;
  currentTheme = THEMES[id] ? id : 'pop';
  Object.entries(theme.colors).forEach(([v,c])=> document.documentElement.style.setProperty(v, c));
  document.body.classList.toggle('rows', !!theme.rows);
  document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme.colors['--bg-fields']);
  document.querySelectorAll('.theme').forEach(b=> b.classList.toggle('selected', b.dataset.theme===id));
  if(window.refreshTuner) window.refreshTuner();
}

let savedTheme = 'pop';
try { savedTheme = localStorage.getItem('proportions-theme') || 'pop'; } catch(e) {}
if(!THEMES[savedTheme]) savedTheme = 'pop';

const themesBox = document.getElementById('themes');
Object.entries(THEMES).forEach(([id,t])=>{
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'theme';
  b.dataset.theme = id;
  const c = t.colors;
  const swatch = t.rows
    ? [c['--bg-fields'], c['--row1'], c['--row2'], c['--row3'], c['--row-eq'], c['--row4']]
    : null;
  b.innerHTML = '<span class="theme-swatch">' +
    (swatch || [c['--bg-fields'], c['--field-active'], c['--key'], c['--key-blue'], c['--key-del'], c['--equal-active']])
      .map(x=>'<span style="background:'+x+'"></span>').join('') +
    '</span>' + t.name;
  b.addEventListener('click', ()=>{
    applyTheme(id);
    try { localStorage.setItem('proportions-theme', id); } catch(e) {}
  });
  themesBox.appendChild(b);
});
applyTheme(savedTheme);

// SETTINGS PANEL
const settingsPanel = document.getElementById('settings');
function openSettings(){
  settingsPanel.classList.add('open');
  settingsPanel.setAttribute('aria-hidden','false');
}
function closeSettings(){
  settingsPanel.classList.remove('open');
  settingsPanel.setAttribute('aria-hidden','true');
}
document.getElementById('settingsBtn').addEventListener('click', openSettings);
document.getElementById('settingsClose').addEventListener('click', closeSettings);
settingsPanel.addEventListener('click', e=>{ if(e.target===settingsPanel) closeSettings(); });

// COLOR TUNER — opened from "Modifica colori" in the settings, or with ?colori in the address
function openTuner(){
  if(document.querySelector('.tuner')){ document.querySelector('.tuner').classList.remove('closed'); return; }
  const params = new URLSearchParams(location.search);

  const vars = [
    ['--bg-fields',    'Sfondo campi'],
    ['--equal',        'Barre e segno ='],
    ['--icon-bg',      'Bollo impostazioni'],
    ['--icon',         'Icona impostazioni'],
    ['--field-active', 'Campo attivo'],
    ['--text-active',  'Numero nel campo attivo'],
    ['--field-idle',   'Campi non attivi'],
    ['--text-idle',    'Numeri nei campi non attivi'],
    ['--bg',           'Sfondo tastiera'],
    ['--text-result',  'Risultato'],
    ['--key',          'Tasti numeri'],
    ['--text-keys',    'Cifre sui tasti'],
    ['--key-blue',     'Tasto C'],
    ['--text-c',       'Testo tasto C'],
    ['--key-del',      'Tasto DEL'],
    ['--text-del',     'Testo tasto DEL'],
    ['--equal-off',    'Tasto = spento'],
    ['--equal-active', 'Tasto = acceso'],
    ['--text-equal',   'Testo tasto =']
  ];
  if(document.body.classList.contains('rows')) vars.push(
    ['--row1',         'Riga 7 8 9 C'],
    ['--row2',         'Riga 4 5 6 DEL'],
    ['--row3',         'Riga 1 2 3'],
    ['--row4',         'Riga +/- 0 ,'],
    ['--row-eq',       'Tasto = (righe)'],
    ['--row-text',     'Testo tasti (righe)']
  );
  const root = document.documentElement;
  const current = v => getComputedStyle(root).getPropertyValue(v).trim().toUpperCase();
  const themeValue = v => ((THEMES[currentTheme] || THEMES.pop).colors[v] || '').toUpperCase();

  // Colors passed in the address (e.g. ?colori&bg-fields=4D4DFF) override the theme
  vars.forEach(([v])=>{
    const p = params.get(v.slice(2));
    if(p && /^[0-9a-f]{6}$/i.test(p)) root.style.setProperty(v, '#'+p.toUpperCase());
  });

  const panel = document.createElement('div');
  panel.className = 'tuner';
  panel.innerHTML = '<div class="tuner-head"><span>Colori</span><span class="tuner-toggle">–</span></div><div class="tuner-body"></div>';
  const body = panel.querySelector('.tuner-body');

  function syncAddress(){
    const q = new URLSearchParams();
    q.set('colori','');
    vars.forEach(([v])=>{ if(current(v)!==themeValue(v)) q.set(v.slice(2), current(v).slice(1)); });
    history.replaceState(null, '', '?' + q.toString().replace('colori=','colori'));
  }

  const rows = vars.map(([v,label])=>{
    const row = document.createElement('label');
    row.className = 'tuner-row';
    row.innerHTML = '<input type="color"><span></span><input type="text" maxlength="7">';
    const [picker, name, hex] = [row.children[0], row.children[1], row.children[2]];
    name.textContent = label;
    const set = val=>{
      root.style.setProperty(v, val);
      picker.value = val.toLowerCase();
      hex.value = val;
      syncAddress();
    };
    picker.addEventListener('input', ()=> set(picker.value.toUpperCase()));
    hex.addEventListener('change', ()=>{
      const val = hex.value.trim().replace(/^#?/, '#').toUpperCase();
      if(/^#[0-9A-F]{6}$/.test(val)) set(val); else hex.value = current(v);
    });
    body.appendChild(row);
    return [v, picker, hex];
  });

  // Keep the rows in sync when a theme is picked in the settings
  window.refreshTuner = ()=>{
    rows.forEach(([v,picker,hex])=>{ picker.value = current(v).toLowerCase(); hex.value = current(v); });
    syncAddress();
  };
  window.refreshTuner();

  const actions = document.createElement('div');
  actions.className = 'tuner-actions';
  actions.innerHTML = '<button type="button">Copia colori</button><button type="button" class="secondary">Reset</button><button type="button" class="secondary">Chiudi</button>';
  const [copyBtn, resetBtn, closeBtn] = actions.children;
  copyBtn.addEventListener('click', ()=>{
    const text = vars.map(([v,label])=> label + ': ' + current(v)).join('\n') + '\n\n' + location.href;
    navigator.clipboard.writeText(text).then(()=>{
      copyBtn.textContent = 'Copiati!';
      setTimeout(()=> copyBtn.textContent = 'Copia colori', 1500);
    });
  });
  resetBtn.addEventListener('click', ()=> applyTheme(currentTheme));
  closeBtn.addEventListener('click', ()=>{
    panel.remove();
    window.refreshTuner = null;
    history.replaceState(null, '', location.pathname);
  });
  body.appendChild(actions);

  panel.querySelector('.tuner-head').addEventListener('click', ()=>{
    panel.classList.toggle('closed');
    panel.querySelector('.tuner-toggle').textContent = panel.classList.contains('closed') ? '+' : '–';
  });
  document.body.appendChild(panel);
}

document.getElementById('editColors').addEventListener('click', ()=>{
  closeSettings();
  openTuner();
});
if(new URLSearchParams(location.search).has('colori')) openTuner();
